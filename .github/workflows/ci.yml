name: CI/CD - Frontend React

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad del código con lint
        run: pnpm run lint

      - name: Compilar aplicación React
        run: pnpm run build

      - name: Subir artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: react-dist-build
          path: dist/

  deploy:
    needs: validate-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefacto dist
        uses: actions/download-artifact@v4
        with:
          name: react-dist-build
          path: ./site-dist

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ASIA4L6WFEQSFBKXRXCW }}
          aws-secret-access-key: ${{ secrets.cm18oAdYE71k1c2sOBJeL6FWj763s3IDxWwqZajF }}
          aws-session-token: ${{ secrets. }}
          aws-region: ${{ vars.app-react-2026 }}

      - name: Sincronizar archivos con Amazon S3
        run: aws s3 sync ./site-dist s3://${{ vars.app-react-2026 }} --delete
