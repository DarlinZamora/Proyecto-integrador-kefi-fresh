name: CI - Frontend React

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad del código con lint
        run: pnpm run lint

      - name: Compilar aplicación React
        run: pnpm run build

      - name: Subir artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: react-dist-build
          path: dist/
